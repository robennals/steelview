  - heading: The extra people made the economy bigger, but not the people richer
    visual:
      cite: "#fact-immigration-economy-and-public-finances/gdp-per-head-barely-grew"
      kind: series
      title: UK GDP
    citations:
      - phrase: Since 2019, output per person has barely moved
        href: "#fact-immigration-economy-and-public-finances/gdp-per-head-barely-grew"
      - phrase: even as the economy grew
        href: "#fact-immigration-economy-and-public-finances/total-gdp-grew"
      - phrase: Extra migrants add to the size of the economy
        href: "#fact-immigration-economy-and-public-finances/total-gdp-moves-with-migration"
      - phrase: they change output per person by under 1%, up or down
        href: "#fact-immigration-economy-and-public-finances/obr-per-head-effect-small"
      - phrase: If buildings and equipment do not keep up, extra migrants leave it lower
        href: "#fact-immigration-economy-and-public-finances/capital-does-not-adjust"
      - phrase: public investment does not grow straight away when the population does
        href: "#fact-immigration-housing-and-public-services/investment-does-not-adjust"
      - phrase: Canada and Germany did worse
        href: "#fact-immigration-economy-and-public-finances/g7-stalled-alike"
    verification:
      status: verified
      textHash: e2c0b5b886c8
      checkedAt: 2026-11-23
      notes:
        - No study attributes the post-2019 stall among its causes; the card claims only that a bigger economy has not meant higher output per person.
  - heading: Homes have not kept up with the extra households
    visual:
      cite: "#fact-immigration-housing-and-public-services/migration-share-of-household-growth"
      kind: comparison
      title: Projected household growth
    citations:
      - phrase: Migration accounts for just over half of the extra households England expects
        href: "#fact-immigration-housing-and-public-services/migration-share-of-household-growth"
      - phrase: England is adding fewer homes each year than the households projected
        href: "#fact-immigration-housing-and-public-services/building-below-household-growth"
      - phrase: About a third of private renters were born abroad
        href: "#fact-immigration-housing-and-public-services/migrants-concentrated-in-private-renting"
      - phrase: immigration explains only a small part of the long rise in house prices
        href: "#fact-immigration-housing-and-public-services/immigration-explains-4-6-percent-of-house-price-rise"
