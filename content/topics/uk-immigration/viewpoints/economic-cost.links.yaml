        href: "#fact-immigration-housing-and-public-services/rent-effects"
    verification:
      status: verified
      textHash: 681f65cf0e39
      checkedAt: 2026-11-23
      notes:
        - Households are not dwellings, so homes against households is not an exact shortfall. The household share is from the 2022-based projection, made when net migration was far higher than now.
  - heading: Low-paid routes bring people who cost more than they pay in
    visual:
      cite: "#fact-immigration-economy-and-public-finances/care-route-net-cost"
      kind: comparison
      title: Lifetime fiscal contribution by visa route
    citations:
      - phrase: Care workers, and the adult family members of health and care workers, cost the public purse more than they pay over their lives
        href: "#fact-immigration-economy-and-public-finances/care-route-net-cost"
      - phrase: So do people who come to join a partner who is British or settled here
        href: "#fact-immigration-economy-and-public-finances/partner-route-lifetime-cost"
      - phrase: the average resident is a lifetime cost too
        href: "#fact-immigration-economy-and-public-finances/average-resident-is-a-lifetime-net-cost"
      - phrase: lower migration raises borrowing within five years
        href: "#fact-immigration-economy-and-public-finances/lower-migration-raises-borrowing"
      - phrase: that window ends before the costs that come as migrants grow old
        href: "#fact-immigration-economy-and-public-finances/five-year-window"
    verification:
      status: verified
      textHash: 650e146ed201
      checkedAt: 2026-11-23
      notes:
        - Care workers are "broadly similar to the UK median for the age group" on an age-matched comparison. Lifetime figures are discounted at 3%.
  - heading: The fall in numbers rests on rules a future government can undo
    visual:
      cite: "#fact-immigration-against-the-long-run/net-migration-is-not-unusual-at-all"
      kind: series
      title: Net migration by route and nationality
    citations:
      - phrase: Net migration has fallen by about four-fifths from its peak
        href: "#fact-immigration-against-the-long-run/net-migration-is-not-unusual-at-all"
      - phrase: as the rules for work and study visas tightened
        href: "#fact-immigration-against-the-long-run/why-immigration-fell"
      - phrase: net migration has fallen below 100,000 only in 2020, during Covid
        href: "#fact-immigration-against-the-long-run/tens-of-thousands-met-only-in-covid"
      - phrase: Since 2019, Conservative and Labour pledges have named no number
        href: "#fact-immigration-against-the-long-run/later-pledges-unquantified"
    verification:
      status: verified
      textHash: f608b9dbbb13
      checkedAt: 2026-11-23
      notes:
        - The fall in work visas began before the 2024 rule changes, with closer scrutiny of employers; both are policy a later government could reverse.
        - The 2015 and 2017 Conservative manifestos repeated "tens of thousands"; in 2024 the Conservatives proposed a cap but named no level.
  - heading: So Parliament should set a binding cap and lengthen the wait to settle
