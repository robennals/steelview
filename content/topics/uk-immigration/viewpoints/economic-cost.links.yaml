cards:
  - heading: Britain has just had the biggest wave of immigration on record
    visual:
      cite: "#fact-immigration-against-the-long-run/record-immigration-2021-to-2024"
      kind: series
      title: UK migration
    citations:
      - phrase: More people moved to Britain in each year from 2021 to 2024 than in any earlier year since the record began in 1964
        href: "#fact-immigration-against-the-long-run/record-immigration-2021-to-2024"
      - phrase: In those four years, net migration added about 2.5 million people
        href: "#fact-immigration-against-the-long-run/four-years-gross-and-net"
