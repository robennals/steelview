cards:
  - heading: About 2.2 million people built their lives around a path the state set out
    visual:
      cite: "#fact-settlement-and-migrant-status/path-2-2-million"
      kind: barChart
      title: Settled, and on a path to settlement
    citations:
      - phrase: About 2.2 million people were on a five-year path to settlement at the end of 2024
        href: "#fact-settlement-and-migrant-status/path-2-2-million"
      - phrase: Most came to work, or came with someone who did
        href: "#fact-settlement-and-migrant-status/most-on-a-path-came-to-work"
