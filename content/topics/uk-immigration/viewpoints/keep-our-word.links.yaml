        href: "#fact-settlement-and-migrant-status/children-on-a-path"
    verification:
      status: verified
      textHash: 724d7aa1b9be
      checkedAt: 2026-11-23
      notes:
        - Worker main applicants and their dependants are about 1.4 million of the 2.2 million; the worker count includes some visas that do not lead to settlement. Not everyone on a path will apply.
  - heading: Changing the terms part-way through has been ruled an abuse of power before
    visual:
      cite: "#fact-settlement-and-migrant-status/high-court-struck-down-mid-route-change-2008"
      kind: quotes
      title: What were people on a path to settlement told, and what did a court make of it?
    citations:
      - phrase: the High Court ruled in 2008 that this was "conspicuous unfairness and an abuse of power"
        href: "#fact-settlement-and-migrant-status/high-court-struck-down-mid-route-change-2008"
      - phrase: it called the Hong Kong route a "historic and moral commitment"
        href: "#fact-settlement-and-migrant-status/bno-historic-and-moral-commitment"
      - phrase: the skilled-worker guidance says only that people "may be able to apply"
        href: "#fact-settlement-and-migrant-status/guidance-said-may-be-able-to-apply"
    verification:
      status: verified
      textHash: 8c4c7681fe28
      checkedAt: 2026-11-23
      notes:
        - The 2008 ruling turned on what that scheme's documents promised; whether a court would read today's "may be able to apply" the same way is untested.
  - heading: The government now proposes to make them wait longer, part-way through
    visual:
      cite: "#fact-settlement-and-migrant-status/proposal-covers-people-already-here"
      kind: quotes
      title: Should a longer wait for settlement apply to people already on the path?
    citations:
      - phrase: The government proposes applying a longer wait to everyone here who has not yet settled
        href: "#fact-settlement-and-migrant-status/proposal-covers-people-already-here"
      - phrase: Most adult dependants of skilled workers earn too little for the five-year route
        href: "#fact-settlement-and-migrant-status/dependants-ten-year-route"
      - phrase: MPs found it "common" for the Home Office to protect people already on a route, though there is precedent for not doing so
        href: "#fact-settlement-and-migrant-status/transitional-protection-precedent"
      - phrase: the Home Secretary had still not said whether anyone already on the path would be protected
        href: "#fact-settlement-and-migrant-status/transitional-arrangements-undecided"
    verification:
      status: verified
      textHash: e06f0278b921
      checkedAt: 2026-11-23
      notes:
        - The dependants' figure is median earnings of those in work (£30,200) against the £50,270 income that would earn a five-year route.
  - heading: Many on the path are well-paid workers, worth more to Britain if they stay
    visual:
