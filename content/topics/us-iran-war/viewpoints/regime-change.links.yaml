cards:
  - heading: The government answers protest with mass killing
    visual:
      cite: "#fact-iran-government-and-its-people/january-2026-crackdown-toll"
      kind: comparison
      title: Deaths in Iran's 2025–26 protests
    citations:
      - phrase: at least 7,007 people were confirmed killed, most of them protesters
        href: "#fact-iran-government-and-its-people/january-2026-crackdown-toll"
      - phrase: more than 50,000 were arrested
        href: "#fact-iran-government-and-its-people/arrests-january-2026"
      - phrase: A UN team found crimes against humanity
        href: "#fact-iran-government-and-its-people/un-crimes-against-humanity"
      - phrase: each of the last three waves of protest, in 2019, 2022 and 2026, was put down with lethal force
        href: "#fact-iran-government-and-its-people/crackdowns-2019-2022-2026"
    verification:
      status: verified
      textHash: e0d3c6004865
      checkedAt: 2026-11-23
      notes:
        - HRANA's 7,007 is a floor, with 11,744 cases under review; the government counted 3,117.
  - heading: The killing goes on between protests, whoever wins elections
    visual:
      cite: "#fact-iran-government-and-its-people/execution-rate-by-president"
      kind: comparison
      title: Executions per month, by Iran's president
    citations:
      - phrase: The rate of executions rose under every recent president, and fastest under the moderate one elected in 2024
        href: "#fact-iran-government-and-its-people/execution-rate-by-president"
      - phrase: In 2025 Iran put more people to death than in any year since 1989
        href: "#fact-iran-government-and-its-people/executions-most-since-1989"
      - phrase: carried out most of the executions recorded anywhere in the world
        href: "#fact-iran-government-and-its-people/iran-top-recorded-executioner"
      - phrase: up to 2021, about one in a hundred or fewer of those who registered to run for president were allowed on the ballot
        href: "#fact-iran-government-and-its-people/vetting-approves-few"
      - phrase: the new Supreme Leader is the old one's son
        href: "#fact-iran-government-and-its-people/hereditary-succession"
    verification:
      status: verified
      textHash: c165b418d6f8
      checkedAt: 2026-11-23
      notes:
        - Amnesty's world count leaves out China, which it believes executed thousands. In 2024 six of more than 80 registrants were approved.
  - heading: The same rulers threaten people far beyond Iran
    visual:
      cite: "#fact-iran-actions-abroad/mi5-uk-plots-and-arrests"
      kind: keyFigures
      title: MI5 on Iran-backed plots in the UK
    citations:
      - phrase: Britain's security service says it tracked more than twenty potentially lethal Iran-backed plots in a single year
        href: "#fact-iran-actions-abroad/mi5-uk-plots-and-arrests"
      - phrase: Most recent Iranian plots in Europe targeted the government's own critics
        href: "#fact-iran-actions-abroad/plots-mostly-target-opponents"
      - phrase: whether Iran builds a bomb is the Supreme Leader's decision
        href: "#fact-iran-nuclear-programme/ata-2025-not-building"
    verification:
      status: verified
      textHash: 8c8949789f82
      checkedAt: 2026-11-23
      notes:
        - MI5's count is unaudited. The plots-in-Europe counts are one author's, at a think tank that generally favours a hard line. The Supreme Leader point rests on US intelligence saying Khamenei had not reauthorized the programme.
  - heading: Iranians are turning away from their government
    visual:
      cite: "#fact-iran-government-and-its-people/few-prefer-islamic-republic"
      kind: comparison
      title: Preferred political system in Iran
    citations:
      - phrase: only about one in eight chose the Islamic Republic as the system they prefer
        href: "#fact-iran-government-and-its-people/few-prefer-islamic-republic"
      - phrase: about three in five said they were glad to see it weakened during the war
        href: "#fact-iran-government-and-its-people/satisfaction-at-weakening"
      - phrase: Turnout in the last two presidential elections was the lowest since the revolution
        href: "#fact-iran-government-and-its-people/turnout-record-lows"
      - phrase: about as many Iranians called the strikes an attack on Iran as called them help
        href: "#fact-iran-government-and-its-people/strikes-seen-as-aggression"
    verification:
      status: verified
      textHash: fdf528bfe974
      checkedAt: 2026-11-23
      notes:
        - GAMAAN is an online survey; about a quarter chose no clear alternative. "Glad" is its "felt satisfaction".
  - heading: Iranians must win this themselves, and America can help them hold out
    visual:
      cite: "#fact-outside-attempts-to-change-hostile-regimes/nonviolent-campaigns-won-twice-as-often"
      kind: comparison
      title: How often uprisings won
    citations:
      - phrase: Peaceful uprisings have won about twice as often as armed ones
        href: "#fact-outside-attempts-to-change-hostile-regimes/nonviolent-campaigns-won-twice-as-often"
      - phrase: far more often where the security forces turned against the rulers
        href: "#fact-outside-attempts-to-change-hostile-regimes/security-force-defections-decide"
      - phrase: Outside backing has made no difference to whether peaceful uprisings win
        href: "#fact-outside-attempts-to-change-hostile-regimes/outside-backing-did-not-help-nonviolent-campaigns"
      - phrase: governments imposed from outside more than double the risk of civil war
        href: "#fact-outside-attempts-to-change-hostile-regimes/imposed-regime-change-and-civil-war"
    verification:
      status: verified
      textHash: 61b1502b74cb
      checkedAt: 2026-11-23
      notes:
        - Data run 1900–2006 and may miss campaigns crushed early. No study here tests the narrower help this viewpoint proposes (internet access, protecting exiles).
  - heading: So America should make no deal that props up Iran's rulers, and stand with Iranians until they are free
    citations:
      - phrase: Iran's economy grew in the first year of the last deal
        href: "#fact-iran-government-and-its-people/growth-in-deal-years"
    verification:
      status: verified
      textHash: eb48d9cc408a
      checkedAt: 2026-11-23
      notes:
        - That lifting sanctions gives the government more money is the plain reading; the growth series do not separate sanctions from oil prices. No study here shows that the proposed help changes an uprising's outcome, which the text concedes.
