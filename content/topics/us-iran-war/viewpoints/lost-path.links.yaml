cards:
  - heading: The 2015 deal held Iran's uranium in check until the US walked away
    visual:
      cite: "#fact-iran-nuclear-programme/deal-era-compliance"
      kind: series
      title: Iran's enriched-uranium stock
    citations:
      - phrase: In every inspection report from 2017 until mid-2019, Iran's uranium stock stayed under the 2015 deal's limit
        href: "#fact-iran-nuclear-programme/deal-era-compliance"
      - phrase: The US left the deal in 2018, and about a year later Iran broke the limit
        href: "#fact-iran-nuclear-programme/breaches-after-us-exit"
      - phrase: it began making it in 2021
        href: "#fact-iran-nuclear-programme/sixty-percent-growth"
    verification:
      status: verified
      textHash: c2b278bbcbe9
      checkedAt: 2026-11-23
      notes:
        - Reports from February 2017 to May 2019. Iran said in May 2019 it would no longer be bound by the limits; the deal's caps were for 10 to 15 years.
  - heading: Iran was close to the material for a bomb, but was not building one
    visual:
      cite: "#fact-iran-nuclear-programme/no-ongoing-programme-2025"
      kind: timeline
      title: Official statements on weapons work
    citations:
      - phrase: In 2025 UN inspectors found no credible sign of an active weapons programme
        href: "#fact-iran-nuclear-programme/no-ongoing-programme-2025"
      - phrase: US intelligence judged that Iran was not building a bomb and that its leader had not ordered one
        href: "#fact-iran-nuclear-programme/ata-2025-not-building"
      - phrase: UN inspectors place Iran's organised weapons work before the end of 2003
        href: "#fact-iran-nuclear-programme/past-weapons-work"
      - phrase: Iran was the only country without nuclear weapons making 60% uranium
        href: "#fact-iran-nuclear-programme/only-non-weapon-state-at-60"
    verification:
      status: verified
      textHash: 3b8a8cd6d351
      checkedAt: 2026-11-23
      notes:
        - The same 2025 IAEA report said it could not assure the programme was peaceful, and US intelligence said pressure to build had "probably built". "Had not ordered one" is "has not reauthorized" the programme halted in 2003.
  - heading: Talks were under way when the bombs fell
    visual:
      cite: "#fact-decisions-law-and-diplomacy/talks-under-way-when-strikes-came"
      kind: timeline
      title: US–Iran negotiations and agreements
    citations:
      - phrase: US and Iranian negotiators held talks in Geneva two days before the strikes
        href: "#fact-decisions-law-and-diplomacy/talks-under-way-when-strikes-came"
      - phrase: Iran signed a promise never to make nuclear weapons
        href: "#fact-decisions-law-and-diplomacy/mou-no-weapons-pledge"
      - phrase: that agreement broke down within three weeks
        href: "#fact-decisions-law-and-diplomacy/mou-broke-down"
      - phrase: Countries give up nuclear programmes most often when threats come with face-saving rewards
        href: "#fact-outside-attempts-to-change-hostile-regimes/threats-plus-rewards"
    verification:
      status: verified
      textHash: 9d9b96b592a1
      checkedAt: 2026-11-23
      notes:
        - The Geneva talks were indirect. Mehta's finding includes force "on the table" alongside threats of sanctions.
  - heading: The war has killed thousands of Iranians who had no say in it
    visual:
      cite: "#fact-human-and-financial-costs-of-the-war/civilian-minimum-by-april"
      kind: compositionBar
      title: Deaths in Iran from the war, by counter
    citations:
      - phrase: at least 1,701 civilians were killed by the April ceasefire, at least 254 of them children
        href: "#fact-human-and-financial-costs-of-the-war/civilian-minimum-by-april"
      - phrase: Every count puts Iran's deaths in the thousands
        href: "#fact-human-and-financial-costs-of-the-war/deaths-in-the-thousands"
      - phrase: the independent counts stop in April
        href: "#fact-human-and-financial-costs-of-the-war/no-count-after-april"
      - phrase: About 3.2 million people have been driven from their homes inside Iran
        href: "#fact-human-and-financial-costs-of-the-war/displaced-millions"
      - phrase: very few of the people who register are allowed to run for president
        href: "#fact-iran-government-and-its-people/vetting-approves-few"
    verification:
      status: verified
      textHash: 45881fcec6fa
      checkedAt: 2026-11-23
      notes:
        - Hengaw counts most of the dead as military. The 3.2 million is a WHO estimate, with no figure for returns. The vetting share is for 2001–2021; in 2024 six of more than 80 were approved.
  - heading: Strikes since June 2025 have blinded the inspectors, and bombs cannot do their job
    visual:
      cite: "#fact-iran-nuclear-programme/verification-stopped"
      kind: timeline
      title: What IAEA inspectors could see in Iran
    citations:
      - phrase: Inspectors had checked almost all of Iran's 60% uranium before the first strikes in June 2025. No inspector has seen it since, and the UN agency cannot say where it is
        href: "#fact-iran-nuclear-programme/stock-unaccounted-for"
      - phrase: Iran then suspended its cooperation by law
        href: "#fact-iran-nuclear-programme/access-narrowed-in-steps"
      - phrase: by February 2026 inspectors were back at seven of the 13 sites that had not been struck
        href: "#fact-iran-nuclear-programme/access-narrowed-in-steps"
      - phrase: Since this war began, they have visited one, a power plant
        href: "#fact-iran-nuclear-programme/verification-stopped"
      - phrase: Experts see no route for Iran to make bomb-grade uranium for now, but will not say for how long
        href: "#fact-iran-nuclear-programme/no-route-to-weapons-grade"
      - phrase: Past strikes on nuclear sites delayed programmes only modestly
        href: "#fact-outside-attempts-to-change-hostile-regimes/strikes-delay-modestly"
    verification:
      status: verified
      textHash: ccfc1c36fc9a
      checkedAt: 2026-11-23
      notes:
        - Access had also narrowed from February 2021, when Iran ended complementary access, and Iran ended the Cairo inspection agreement in November 2025.
  - heading: So the US should stop bombing and go back to inspections
    citations:
      - phrase: Iran's economy grew in the deal's first year and shrank after the US left
        href: "#fact-iran-government-and-its-people/growth-in-deal-years"
    verification:
      status: verified
      textHash: cf13a42b20ac
      checkedAt: 2026-11-23
      notes:
        - The growth series do not separate sanctions from oil prices, hence "plausibly". "A deal is how to get them back in" is the viewpoint's judgment.
