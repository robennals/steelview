      checkedAt: 2026-11-23
      notes:
        - "Gallup, June: 63% disapprove of the military action. Pew in October found 65% disapproving of the President's handling. Most Republicans still approve."
  - heading: Iran was not a danger that needed an American war
    visual:
      cite: "#fact-iran-actions-abroad/attacks-on-us-forces-before-the-war"
      kind: series
      title: Attacks on US forces in Iraq and Syria
    citations:
      - phrase: In 2025 US intelligence judged that Iran was not building a nuclear weapon
        href: "#fact-iran-nuclear-programme/ata-2025-not-building"
      - phrase: Groups allied with Iran attacked US troops in Iraq and Syria more than 200 times
        href: "#fact-iran-actions-abroad/attacks-on-us-forces-before-the-war"
      - phrase: four in five of those attacks came in four months, to January 2024
        href: "#fact-iran-actions-abroad/attacks-came-in-a-burst"
      - phrase: none of those plots led to a killing
        href: "#fact-iran-actions-abroad/us-plots-were-foiled"
      - phrase: US courts have sentenced the men behind them
        href: "#fact-iran-actions-abroad/us-convictions-iran-directed-plots"
    verification:
      status: verified
      textHash: 6c300e227131
      checkedAt: 2026-11-23
      notes:
        - The same 2025 assessment warned that pressure to build a bomb had "probably built". The attacks were on US and coalition forces, October 2023 to December 2024. "The men behind them" are those sentenced in the Alinejad plots; the other US cases are charges.
  - heading: The war is costing Americans billions, and the bill keeps growing
    visual:
      cite: "#fact-human-and-financial-costs-of-the-war/cost-38-to-47-billion"
      kind: estimateRange
      title: Estimates of the Iran war's cost
    citations:
      - phrase: The Pentagon's figure for its cost has nearly doubled since April
        href: "#fact-human-and-financial-costs-of-the-war/cost-38-to-47-billion"
      - phrase: each further month of fighting adds $2–3 billion
        href: "#fact-human-and-financial-costs-of-the-war/monthly-cost-going-forward"
      - phrase: the war has cost far less than Iraq so far
        href: "#fact-human-and-financial-costs-of-the-war/cost-small-against-iraq"
      - phrase: it ended up costing more than thirteen times the White House's forecast
        href: "#fact-human-and-financial-costs-of-the-war/iraq-overran-estimates"
      - phrase: The war has also drawn down the missiles that defend US troops and allies from attack, leaving them to take more risks with what is left
