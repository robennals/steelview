      title: Approval of the war, by party
    citations:
      - phrase: "\"I'm not going to start a war. I'm going to stop wars.\""
        href: "#fact-decisions-law-and-diplomacy/campaign-said-stop-wars"
      - phrase: nearly two in three Americans disapprove of the war
