  - heading: Deals and sanctions had not stopped Iran, and the strikes have, for now
    visual:
      cite: "#fact-iran-nuclear-programme/strikes-halted-enrichment"
      kind: quotes
      title: What did the strikes do to Iran's enriched uranium and nuclear industry?
    citations:
      - phrase: The 2015 deal capped Iran's enrichment for only 15 years
        href: "#fact-iran-nuclear-programme/deal-cap-was-temporary"
      - phrase: Iran built up its 60% uranium for four years
        href: "#fact-iran-nuclear-programme/sixty-percent-growth"
      - phrase: sanctions have rarely stopped a nuclear programme once it has started
        href: "#fact-outside-attempts-to-change-hostile-regimes/nonproliferation-sanctions-three-of-22"
