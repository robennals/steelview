cards:
  - heading: Iran was one short step from enough uranium for a bomb
    visual:
      cite: "#fact-iran-nuclear-programme/sixty-percent-growth"
      kind: series
      title: Iran's uranium enriched to 60%
    citations:
      - phrase: Its stock of uranium enriched to 60% more than doubled in the eight months before the June 2025 strikes
        href: "#fact-iran-nuclear-programme/sixty-percent-growth"
      - phrase: Bombs use uranium enriched to about 90%, and little extra work gets from 60% to there
        href: "#fact-iran-nuclear-programme/sixty-is-not-ninety"
      - phrase: Nuclear power plants need less than 5%
        href: "#fact-iran-nuclear-programme/power-reactors-need-under-five"
      - phrase: No other country without nuclear weapons makes 60% uranium
        href: "#fact-iran-nuclear-programme/only-non-weapon-state-at-60"
      - phrase: US intelligence judged Iran probably under a week from enough bomb-grade uranium for one bomb
        href: "#fact-iran-nuclear-programme/close-to-weapons-grade-before-strikes"
    verification:
      status: verified
      textHash: 871efcb3ecbf
      checkedAt: 2026-11-23
      notes:
        - From 182.3 kg in October 2024 to 440.9 kg on 13 June 2025, an IAEA estimate. Under a week is to enough weapons-grade uranium, not to a usable weapon; CRS gives about a year for the other weapon-making steps.
  - heading: Iran had hidden weapons work before, and inspectors could no longer vouch for it
    visual:
      cite: "#fact-iran-nuclear-programme/past-weapons-work"
      kind: timeline
      title: Official statements on weapons work
    citations:
      - phrase: Before 2004 it ran a secret programme of weapons-related work, and it later hid the evidence
        href: "#fact-iran-nuclear-programme/past-weapons-work"
      - phrase: In 2021 it ended the inspectors' extra visits
        href: "#fact-iran-nuclear-programme/complementary-access-ended"
      - phrase: UN inspectors said they could not assure the world that its programme was peaceful
        href: "#fact-iran-nuclear-programme/no-assurance-peaceful"
      - phrase: their board later found Iran in breach of its obligations
        href: "#fact-iran-nuclear-programme/board-non-compliance"
      - phrase: US intelligence judged in 2025 that Iran was not building a bomb
        href: "#fact-iran-nuclear-programme/ata-2025-not-building"
      - phrase: pressure on Iran's leader to build one had probably grown
        href: "#fact-iran-nuclear-programme/ata-2025-not-building"
    verification:
      status: verified
      textHash: 8a2499bf6454
      checkedAt: 2026-11-23
      notes:
        - "\"Hid the evidence\" is the IAEA's \"sanitised locations\". The same May 2025 report found no credible sign of an ongoing structured programme."
  - heading: Iran already attacks its enemies, and a bomb would let it do so without fear
    visual:
      cite: "#fact-iran-actions-abroad/argentine-court-buenos-aires-bombings"
      kind: timeline
      title: Court cases over Iran-linked plots
    citations:
      - phrase: An Argentine court held Iran-backed Hezbollah responsible for two bombings in Buenos Aires
        href: "#fact-iran-actions-abroad/argentine-court-buenos-aires-bombings"
      - phrase: US courts have sentenced men hired for Iran's Revolutionary Guards to kill a journalist on American soil
        href: "#fact-iran-actions-abroad/us-convictions-iran-directed-plots"
      - phrase: Groups allied with Iran attacked US and coalition forces more than 200 times in 2023 and 2024
        href: "#fact-iran-actions-abroad/attacks-on-us-forces-before-the-war"
    verification:
      status: verified
      textHash: 44b749826a58
      checkedAt: 2026-11-23
      notes:
        - Iran denies the Buenos Aires bombings and no one has been tried in person. The US cases are plots; none led to a killing.
  - heading: An Iranian bomb could set off a race for bombs across the region
    visual:
      cite: "#fact-outside-attempts-to-change-hostile-regimes/saudi-2018-pledge"
