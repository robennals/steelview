# against its evidence. The text itself is in the .md file beside this one.
# Format: lib/content/viewpoint-links.ts. Process: content/WORKFLOW.md, stage 6.
summary:
  citations:
    - phrase: Most people who cross the Channel and get a decision are granted protection
      href: "#fact-asylum-claims-and-decisions/small-boat-claims-mostly-granted"
    - phrase: war drove them out
      href: "#fact-asylum-claims-and-decisions/rise-linked-to-conflict"
    - phrase: Britain offers refugees almost no safe way in
      href: "#fact-safe-and-legal-routes/claim-must-be-made-in-uk"
    - phrase: Britain welcomed hundreds of thousands of Ukrainians and Hong Kongers
      href: "#fact-safe-and-legal-routes/nationalities-with-safe-routes-rarely-came-by-boat"
    - phrase: cost £715 million
      href: "#fact-deterrence-and-protection-policies/rwanda-cost-and-relocations"
