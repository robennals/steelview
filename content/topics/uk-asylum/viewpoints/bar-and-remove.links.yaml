cards:
  - heading: By 2025, Britain was seeing more asylum claims than ever before
    visual:
      cite: "#fact-asylum-claims-and-decisions/claims-over-time"
      kind: series
      title: People claiming asylum in the UK
    citations:
      - phrase: Asylum claims passed their 2002 peak
        href: "#fact-asylum-claims-and-decisions/claims-over-time"
      - phrase: reached record levels in 2024 and 2025
        href: "#fact-asylum-claims-and-decisions/record-year-to-september-2025"
      - phrase: small boats carried a few hundred people across the Channel. They went on to carry tens of thousands a year
        href: "#fact-channel-crossings-and-irregular-arrivals/crossings-since-2018"
      - phrase: costs about £4 billion a year
        href: "#fact-asylum-backlog-accommodation-and-cost/support-costs-about-4bn-a-year"
      - phrase: Crossings fell sharply in 2026
        href: "#fact-channel-crossings-and-irregular-arrivals/arrivals-fell-sharply-in-2026"
      - phrase: crossings into Europe fell too
        href: "#fact-channel-crossings-and-irregular-arrivals/crossings-into-the-eu-have-also-fallen"
      - phrase: no one has shown what caused the fall
        href: "#fact-channel-crossings-and-irregular-arrivals/fall-cause-not-isolated"
    verification:
      status: verified
      textHash: 621747bfdc5f
      checkedAt: 2026-11-22
      notes:
        - 2025 is a record for the year to September 2025 (109,662). The 2025 calendar total, 101,911, is just under 2002's 103,081.
  - heading: Some of the groups who come commit far more crime
    visual:
      cite: "#fact-offending-by-nationality/afghan-sex-offence-rate"
      kind: estimateRange
      title: Conviction rates for nationalities that claim asylum
    citations:
      - phrase: After adjusting for age and sex, Afghan nationals were convicted of sex offences at seven times the British rate
        href: "#fact-offending-by-nationality/afghan-sex-offence-rate"
      - phrase: Iraqi, Afghan and Iranian citizens were convicted at four to six and a half times the British rate
        href: "#fact-offending-by-nationality/asylum-nationalities-all-offences"
      - phrase: can bring that with them
        href: "#fact-offending-by-nationality/war-exposure-raises-violent-crime"
      - phrase: no statistics record whether those offenders had claimed asylum
        href: "#fact-offending-by-nationality/status-not-recorded"
      - phrase: the Ministry of Justice is appealing an order to publish more detailed figures
        href: "#fact-offending-by-nationality/release-under-appeal"
    verification:
      status: verified
      textHash: 77add65099f3
      checkedAt: 2026-11-22
      notes:
        - The all-offences multiples are not adjusted for age and sex, unlike the sex-offence figure, and count cautions as well as convictions. The Economist calls the sex-offence figure "still uncertain".
        - The Swiss study behind "can bring that with them" covers childhood exposure to war or mass killing. It finds the effect falls mostly on co-nationals, and that work access removes two-thirds of it. No report covers "where the law is weak".
  - heading: Everyone on a small boat has already reached a safe country
    visual:
      cite: "#fact-channel-crossings-and-irregular-arrivals/boats-leave-from-france-and-belgium"
      kind: map
      title: Where the small boats leave from
    citations:
      - phrase: The boats set off from France and Belgium
        href: "#fact-channel-crossings-and-irregular-arrivals/boats-leave-from-france-and-belgium"
      - phrase: British law already expects a refugee who stopped in another country to seek protection there
        href: "#fact-asylum-law-and-the-echr/uk-law-ties-article-31-to-the-first-safe-country"
      - phrase: do not send a refugee back to danger
        href: "#fact-asylum-law-and-the-echr/article-33-forbids-return"
      - phrase: do not punish one for entering illegally
        href: "#fact-asylum-law-and-the-echr/article-31-is-about-penalties"
      - phrase: few refugees could reach Britain without passing through another country
        href: "#fact-asylum-law-and-the-echr/few-reach-the-uk-without-passing-through-another-state"
    verification:
      status: verified
      textHash: cbe02eed78b4
      checkedAt: 2026-11-22
      notes:
        - The 2022 rule governs the defence against penalties for illegal entry, and asks whether the refugee could reasonably have claimed elsewhere.
  - heading: Claiming asylum means staying, even for people who are refused
    visual:
      cite: "#fact-removals-and-what-stops-them/fewer-refused-recorded-leaving"
      kind: series
      title: Asylum claims and later returns
    citations:
      - phrase: over a quarter of each year's asylum claims ended with the person recorded as returned
        href: "#fact-removals-and-what-stops-them/fewer-refused-recorded-leaving"
      - phrase: An asylum appeal takes over a year on average
        href: "#fact-asylum-backlog-accommodation-and-cost/asylum-appeal-takes-72-weeks"
      - phrase: most challenges failed in 2017
        href: "#fact-removals-and-what-stops-them/most-issues-refused"
    verification:
      status: verified
      textHash: fcc30d693ca9
      checkedAt: 2026-11-22
      notes:
        - '"Usually" holds for refused and withdrawn claims together (under a third returned since 2015). Against refusals alone, the share was 34–55% for 2015–22 claims.'
        - The 2017 figure covers issues raised in detention. Not every challenge suspends a removal.
  - heading: Human-rights law stops removals, and it cannot be fixed from inside
    visual:
      cite: "#fact-removals-and-what-stops-them/home-office-says-rights-claims-stop-removals"
      kind: quotes
      title: What do the Home Office and others say human-rights law does to removals?
    citations:
      - phrase: 86% of people who made a human-rights claim while held for removal in 2022 were released
        href: "#fact-removals-and-what-stops-them/home-office-says-rights-claims-stop-removals"
      - phrase: foreign offenders who won on human-rights grounds alone equal to about 3% of those deported
        href: "#fact-removals-and-what-stops-them/human-rights-wins-about-3-percent"
      - phrase: they leave out claims of danger made inside asylum cases
        href: "#fact-removals-and-what-stops-them/counts-miss-article-3-in-asylum-claims"
      - phrase: no published figure counts the removals the ECHR stops
        href: "#fact-removals-and-what-stops-them/echr-share-not-measured"
      - phrase: judged that such limits would likely fail in court
        href: "#fact-asylum-law-and-the-echr/wolfson-limits-inside-the-echr-likely-fail"
      - phrase: Britain can lawfully leave and still keep the Refugee Convention
        href: "#fact-asylum-law-and-the-echr/wolfson-withdrawal-possible-refugee-convention-unnecessary"
    verification:
      status: verified
      textHash: 478e39a7cee3
      checkedAt: 2026-11-22
      notes:
        - The 86% is of people who raised "rights-based applications" in January to September 2022. The Home Office says it cannot tell that they were released because of the claim.
