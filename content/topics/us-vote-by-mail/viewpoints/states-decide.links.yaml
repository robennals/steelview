cards:
  - heading: The President is trying to set mail-ballot rules himself
    visual:
      cite: "#fact-federal-and-state-power-over-mail-voting/two-orders"
      kind: timeline
      title: Federal moves on mail voting
    citations:
      - phrase: The President has signed two orders setting rules for mail ballots
        href: "#fact-federal-and-state-power-over-mail-voting/two-orders"
      - phrase: The other orders the Postal Service to carry ballots only for voters on a state's list
        href: "#fact-federal-and-state-power-over-mail-voting/federal-moves-to-narrow-mail"
      - phrase: A court ruled that the first order's deadline rules went beyond his power
        href: "#fact-federal-and-state-power-over-mail-voting/eo-14248-deadlines-enjoined"
      - phrase: a court blocked the Postal Service rule for the November 2026 election
        href: "#fact-federal-and-state-power-over-mail-voting/usps-rule-blocked"
      - phrase: the Supreme Court let the second order go ahead
        href: "#fact-federal-and-state-power-over-mail-voting/eo-14399-stands"
      - phrase: it did not decide whether the order is lawful
        href: "#fact-federal-and-state-power-over-mail-voting/no-merits-ruling"
    verification:
      status: verified
      textHash: c3a9521b048e
      checkedAt: 2026-11-23
      notes:
        - The order directs a rule that would have the Postal Service carry ballots only for enrolled voters; the order itself binds only the executive branch. The deadline ruling is under appeal.
  - heading: The Constitution gives election rules to state lawmakers and Congress
    visual:
      cite: "#fact-ballot-deadlines-and-counting-speed/watson-left-it-to-legislatures"
      kind: quotes
      title: What did the Supreme Court say about ballot deadlines in Watson v. RNC?
    citations:
      - phrase: gives the "manner of holding elections" to each state's legislature, and lets Congress "make or alter such regulations"
        href: "#fact-federal-and-state-power-over-mail-voting/elections-clause-text"
      - phrase: it said arguments over them belong to lawmakers, not courts
        href: "#fact-ballot-deadlines-and-counting-speed/watson-left-it-to-legislatures"
    verification:
      status: verified
      textHash: 03ed44d4b11d
      checkedAt: 2026-11-23
      notes:
        - State courts can review a legislature's election rules (Moore v. Harper), and Oregon's system came by citizen initiative, so "state lawmakers" is shorthand for each state's constitutional system.
  - heading: Each state has chosen its own mail system, and changed it when it chose
    visual:
      cite: "#fact-mail-voting-use-and-effects/states-moved-both-ways"
      kind: series
      title: State rules on who may vote by mail
    citations:
      - phrase: The number offering mail voting to every voter rose from 30 in 2016 to 38 in 2020, fell to 35 in 2022, and is expected to reach 37 in 2026
        href: "#fact-mail-voting-use-and-effects/states-moved-both-ways"
      - phrase: Oregon's all-mail system came from its own voters, through a ballot initiative
        href: "#fact-mail-voting-use-and-effects/oregon-by-initiative"
      - phrase: Utah, after years of mailing every voter a ballot, is moving to mail ballots only on request
        href: "#fact-mail-voting-use-and-effects/utah-all-mail-and-opt-in"
      - phrase: Three states ended their extra days for late ballots in 2025
        href: "#fact-federal-and-state-power-over-mail-voting/receipt-deadlines-swung-back"
    verification:
      status: verified
      textHash: 5b01695b6a0e
      checkedAt: 2026-11-23
  - heading: Voters back the system their own state has chosen
    visual:
      cite: "#fact-mail-voting-use-and-effects/support-higher-where-used"
      kind: barChart
      title: Support for mail voting, by state rule
    citations:
      - phrase: Support for letting anyone vote by mail is highest in states that mail every voter a ballot and lowest in states that require an excuse, and that holds within each party
        href: "#fact-mail-voting-use-and-effects/support-higher-where-used"
      - phrase: Most voters in the West used mail even before the pandemic, while in the South mail stayed under a quarter of votes even in 2020
        href: "#fact-mail-voting-use-and-effects/west-votes-by-mail"
    verification:
      status: verified
      textHash: e80211b1c6ed
      checkedAt: 2026-11-23
      notes:
        - The survey cannot say whether using mail voting builds support or supportive states adopt it. Republicans in all-mail states are still under half in favour (46%).
  - heading: Congress may set national rules, but has done so only where states cannot
    visual:
      cite: "#fact-federal-and-state-power-over-mail-voting/national-bills-stalled"
      kind: comparison
      title: Senate votes on national voting rules
    citations:
      - phrase: Congress has strong power over federal elections
        href: "#fact-federal-and-state-power-over-mail-voting/congress-power-paramount"
      - phrase: on mail voting it has used it only for voters no single state can serve. Federal law makes every state let service members and Americans abroad vote by mail
        href: "#fact-federal-and-state-power-over-mail-voting/congress-set-uocava-rules"
      - phrase: Bills now in Congress would push mail voting in opposite directions
        href: "#fact-federal-and-state-power-over-mail-voting/bills-on-both-sides"
      - phrase: national voting bills from both parties have failed in the Senate
        href: "#fact-federal-and-state-power-over-mail-voting/national-bills-stalled"
    verification:
      status: verified
      textHash: c732412da865
      checkedAt: 2026-11-23
      notes:
        - The Republican bill that failed (S. 5271) was a photo-ID bill, not a mail bill; the Democratic bills would have required no-excuse absentee voting. The House-passed SAVE America Act had had no Senate vote by the sources read.
  - heading: So each state's voters, through their lawmakers, should set their mail rules
    citations: []
    verification:
      status: verified
      textHash: ec9dfdfd9e31
      checkedAt: 2026-11-23
