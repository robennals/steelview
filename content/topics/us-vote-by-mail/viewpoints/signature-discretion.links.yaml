cards:
  - heading: Matching signatures is a judgement call, yet it is the top reason ballots are rejected
    visual:
      cite: "#fact-mail-ballot-rejection-and-signature-checks/signatures-largest-reason"
      kind: series
      title: Rejected mail ballots
    citations:
      - phrase: A signature that does not match is now the most common reason given for rejecting a mail ballot
        href: "#fact-mail-ballot-rejection-and-signature-checks/signatures-largest-reason"
      - phrase: Washington's state auditor called signature matching "inherently subjective", and its own reviewers disagreed about many signatures
        href: "#fact-mail-ballot-rejection-and-signature-checks/reviewers-disagree"
      - phrase: where voters are told of a problem, more than half the ballots set aside are corrected and counted
        href: "#fact-mail-ballot-rejection-and-signature-checks/more-than-half-cured"
