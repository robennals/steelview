  - heading: The same rule gives very different results from county to county
    citations:
      - phrase: the county a ballot was cast in mattered more than anything else the auditor measured. For mismatches alone, two counties were 18 times as likely as another to reject a ballot
        href: "#fact-mail-ballot-rejection-and-signature-checks/county-strongest-predictor"
      - phrase: the auditor found no sign of bias in individual decisions
        href: "#fact-mail-ballot-rejection-and-signature-checks/no-evidence-of-bias"
      - phrase: Counties that rejected fewer ballots accepted less certain matches
