cards:
  - heading: Signature checks now reject more mail ballots than anything else
    visual:
      cite: "#fact-mail-ballot-rejection-and-signature-checks/signatures-largest-reason"
      kind: series
      title: Rejected mail ballots
    citations:
      - phrase: A signature that an official judges not to match is now the most common reason given for rejecting a mail ballot. In 2024 it caused two in five rejections, more than twice as many as late arrival
        href: "#fact-mail-ballot-rejection-and-signature-checks/signatures-largest-reason"
      - phrase: Some states also file signature rejections under "other", which this share leaves out
        href: "#fact-mail-ballot-rejection-and-signature-checks/signature-share-reporting"
    verification:
      status: verified
      textHash: e36906ffbb89
      checkedAt: 2026-11-23
      notes:
        - The 2024 category is "non-matching or incomplete" signatures. "Other" is larger than late arrival in 2024; signatures are the most common listed reason.
  - heading: The same check gives very different results from county to county
    visual:
      cite: "#fact-mail-ballot-rejection-and-signature-checks/county-raw-range"
      kind: comparison
      title: "Washington: rejections by county"
    citations:
      - phrase: In Washington in 2020, county rates of rejection for any reason but lateness ran from 1.5% to under a tenth of a percent
        href: "#fact-mail-ballot-rejection-and-signature-checks/county-raw-range"
      - phrase: The state auditor called matching "inherently subjective", and its own reviewers disagreed about many signatures
        href: "#fact-mail-ballot-rejection-and-signature-checks/reviewers-disagree"
      - phrase: two counties were 18 times as likely as another to reject a ballot for a mismatch
        href: "#fact-mail-ballot-rejection-and-signature-checks/county-strongest-predictor"
      - phrase: Counties that rejected fewer ballots accepted less certain matches
        href: "#fact-mail-ballot-rejection-and-signature-checks/low-rejection-counties-accept-more"
      - phrase: the auditor found no bias in single decisions
        href: "#fact-mail-ballot-rejection-and-signature-checks/no-evidence-of-bias"
    verification:
      status: verified
      textHash: 8bdc8fbd6faa
      checkedAt: 2026-11-23
      notes:
        - The raw county rates cover every rejection except late ones; the 18-times figure is after controls for age, race, education and income. The auditor agreed with counties on more than 98% of re-checked signatures.
  - heading: Mail-ballot checks reject young, first-time and Black voters far more often
    visual:
      cite: "#fact-mail-ballot-rejection-and-signature-checks/washington-race-gaps"
      kind: comparison
      title: "Washington: rejections by race"
    citations:
      - phrase: Black voters' mail ballots were rejected at four times white voters' rate, counting unsigned envelopes too
        href: "#fact-mail-ballot-rejection-and-signature-checks/washington-race-gaps"
      - phrase: The youngest voters were rejected most
        href: "#fact-mail-ballot-rejection-and-signature-checks/washington-age-gaps"
      - phrase: that gap held for mismatches alone
        href: "#fact-mail-ballot-rejection-and-signature-checks/youngest-mismatches-alone"
      - phrase: First-time voters were rejected at more than five times the rate of voters who had voted before
        href: "#fact-mail-ballot-rejection-and-signature-checks/first-time-voters-rejected-more"
      - phrase: Studies in Florida found the same for young and inexperienced voters
        href: "#fact-mail-ballot-rejection-and-signature-checks/florida-young-and-inexperienced"
    verification:
      status: verified
      textHash: ca21adda877d
      checkedAt: 2026-11-23
      notes:
        - Race is estimated from surname and address. After controls, Black voters were twice as likely as white voters to be rejected. The Florida findings come from the papers' abstracts.
  - heading: Telling voters of a problem saves most of the ballots it flags
    visual:
      cite: "#fact-mail-ballot-rejection-and-signature-checks/more-than-half-cured"
      kind: comparison
      title: Mail ballots set aside for curing
    citations:
      - phrase: more than half the ballots set aside were fixed and counted
        href: "#fact-mail-ballot-rejection-and-signature-checks/more-than-half-cured"
      - phrase: New Hampshire voters were not told their ballot had been rejected, and that the officials checking had no handwriting training or standards
        href: "#fact-mail-ballot-rejection-and-signature-checks/new-hampshire-due-process"
      - phrase: a federal appeals court let Texas keep rejecting ballots without notice, citing the risk of fraud
        href: "#fact-mail-ballot-rejection-and-signature-checks/fifth-circuit-fraud-risk"
    verification:
      status: verified
      textHash: df86cec78283
      checkedAt: 2026-11-23
      notes:
        - Curing covers every fixable problem, including missing signatures, not only mismatches. Twelve of the 43 curing states did not report figures. The Fifth Circuit's ruling was at the stay stage.
  - heading: The answer is a better check, not none
    visual:
      cite: "#fact-mail-ballot-rejection-and-signature-checks/georgia-fell-after-sb202"
      kind: series
      title: Texas and Georgia rejection rates
    citations:
      - phrase: in Cobb County, Georgia, an envelope the voter's spouse signed by mistake passed the check
        href: "#fact-mail-ballot-rejection-and-signature-checks/cobb-spouse-signature-passed"
      - phrase: Georgia replaced signature matching with an ID number in 2021. Its rejection rate has been roughly half its 2018 level since, though it was above the national rate in 2024
        href: "#fact-mail-ballot-rejection-and-signature-checks/georgia-fell-after-sb202"
      - phrase: the largest group of county officials surveyed said it had not cut rejections
        href: "#fact-mail-ballot-rejection-and-signature-checks/georgia-fell-after-sb202"
      - phrase: Texas's rate rose when it added an ID number on top of signatures, as many voters missed the new field on the envelope
        href: "#fact-mail-ballot-rejection-and-signature-checks/texas-rose-under-id-number"
      - phrase: Britain pairs the signature with something that needs no judgement, the voter's date of birth
        href: "#fact-secret-ballot-and-postal-voting-abroad/uk-checks-identifiers"
    verification:
      status: verified
      textHash: c70019e023e1
      checkedAt: 2026-11-23
      notes:
        - Georgia's earlier rates count every reason; its 2020 rate (0.4%) is a floor, as its count was incomplete. The officials' survey reports a plurality, not a majority. No source here shows whether ID-number checks catch more fraud.
  - heading: So voters must be told of a problem and allowed to fix it
    citations:
      - phrase: as 35 states and DC must already
        href: "#fact-mail-ballot-rejection-and-signature-checks/most-states-cure"
      - phrase: have two reviewers from different parties check every mismatch, as Colorado does
        href: "#fact-mail-ballot-rejection-and-signature-checks/training-and-bipartisan-review"
    verification:
      status: verified
      textHash: e5d982b1bf7d
      checkedAt: 2026-11-23
      notes:
        - The 35 states include some that do not compare signatures, which can only cure missing ones.
