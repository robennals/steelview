cards:
  - heading: The Constitution gives election rules to the states and Congress, not the President
    visual:
      cite: "#fact-federal-and-state-power-over-voting-rules/elections-clause-text"
      kind: quotes
      title: Who does the Constitution let set the rules for federal elections?
    citations:
      - phrase: Each state's legislature decides when, where and how congressional elections are run, and Congress may change those rules
        href: "#fact-federal-and-state-power-over-voting-rules/elections-clause-text"
      - phrase: The Supreme Court has held that Congress's power covers how elections are held, not who may vote
        href: "#fact-federal-and-state-power-over-voting-rules/court-reads-the-clause"
    verification:
      status: verified
      textHash: ad2ce59d6610
      checkedAt: 2026-11-23
      notes:
        - Voter qualifications follow the state's own rules under the Constitution; the Court also said it would raise "serious constitutional doubts" if federal law kept a state from the information needed to enforce them.
  - heading: A president cannot set voting rules by order
    visual:
      cite: "#fact-federal-and-state-power-over-voting-rules/district-courts-blocked-the-2025-order"
      kind: quotes
      title: What have the courts said about the President's orders on election rules?
    citations:
      - phrase: Two federal courts have permanently blocked the 2025 order's proof-of-citizenship rule, and one held that it went beyond a president's power
        href: "#fact-federal-and-state-power-over-voting-rules/district-courts-blocked-the-2025-order"
      - phrase: that order requires nothing of anyone outside the executive branch, and it did not rule on whether the order is lawful
        href: "#fact-federal-and-state-power-over-voting-rules/supreme-court-left-lawfulness-open"
      - phrase: The courts that have ruled on the question agree
        href: "#fact-federal-and-state-power-over-voting-rules/no-merits-ruling"
    verification:
      status: verified
      textHash: 73bf92df518f
      checkedAt: 2026-11-23
      notes:
        - Both rulings are from district courts, and the government has appealed. The Massachusetts ruling is quoted from a law-school case summary.
  - heading: Each state's rule binds only that state, and can be undone
    visual:
      cite: "#fact-voter-id-rules-in-the-us-and-abroad/rules-vary-widely"
      kind: map
      title: Voter ID rules by state
    citations:
      - phrase: States differ on whether ID must have a photo, and on what happens to a voter without it
        href: "#fact-voter-id-rules-in-the-us-and-abroad/rules-vary-widely"
      - phrase: the number of strict photo-ID states fell as courts and legislatures eased laws, then rose again as others tightened theirs
        href: "#fact-voter-id-rules-in-the-us-and-abroad/strict-count-fell-then-rose"
      - phrase: State courts can review a state's election rules
        href: "#fact-federal-and-state-power-over-voting-rules/moore-state-courts"
    verification:
      status: verified
      textHash: abc41f148b8c
      checkedAt: 2026-11-23
      notes:
        - Some state rules were eased or blocked by federal courts, not only by the states themselves.
  - heading: National bills from either party would force one side's choice on every state
    visual:
      cite: "#fact-federal-and-state-power-over-voting-rules/national-bills-stalled"
      kind: comparison
      title: Senate votes on national voting rules
    citations:
      - phrase: The Republican bill would require proof of citizenship to register and photo ID to vote
        href: "#fact-federal-and-state-power-over-voting-rules/save-america-act-provisions"
      - phrase: The Democratic one would have required early voting and made ID states accept alternatives
        href: "#fact-federal-and-state-power-over-voting-rules/freedom-to-vote-act-provisions"
      - phrase: Both stalled short of the 60 votes needed to end debate in the Senate
        href: "#fact-federal-and-state-power-over-voting-rules/national-bills-stalled"
    verification:
      status: verified
      textHash: ddf6cc67ce8f
      checkedAt: 2026-11-23
      notes:
        - The 2026 Senate vote was on a photo-ID-only version of the Republican bill.
  - heading: National rules were needed where states shut voters out, and ID rules have not done that
    visual:
      cite: "#fact-election-fraud-and-voter-exclusion-history/pre-vra-stagnation"
      kind: barChart
      title: Black voter registration before 1965
    citations:
      - phrase: Before the Voting Rights Act, Black registration in three Deep South states rose about five points or less in a decade
        href: "#fact-election-fraud-and-voter-exclusion-history/pre-vra-stagnation"
      - phrase: by 2004 the gaps had closed or nearly closed
        href: "#fact-election-fraud-and-voter-exclusion-history/registration-gap-closed"
      - phrase: a national study found strict ID laws had no clear effect on registration or turnout
        href: "#fact-burdens-of-id-and-citizenship-rules/national-panel-no-turnout-effect"
      - phrase: it cannot rule out drops like those of a few points in Kansas and Tennessee
        href: "#fact-burdens-of-id-and-citizenship-rules/burden-without-turnout-effect"
    verification:
      status: verified
      textHash: cc4ef5beca9d
      checkedAt: 2026-11-23
      notes:
        - GAO's Kansas and Tennessee drops were 2 to 3 points, largest among young, new and Black registrants. The national study covers ID at the polls, not proof of citizenship.
  - heading: So Congress should protect the right to vote, and leave ID to each state's voters
    citations:
      - phrase: The Supreme Court calls Congress's power over elections "paramount"
        href: "#fact-federal-and-state-power-over-voting-rules/congress-power-paramount"
      - phrase: none of them requires ID or proof of citizenship of every voter
        href: "#fact-federal-and-state-power-over-voting-rules/laws-require-no-id-for-all"
    verification:
      status: verified
      textHash: 4357e5f988a0
      checkedAt: 2026-11-23
