cards:
  - heading: The Constitution gives election rules to the states and Congress, not the President
    citations:
      - phrase: Each state's legislature decides when, where and how congressional elections are run, and Congress may change those rules
        href: "#fact-federal-and-state-power-over-voting-rules/elections-clause-text"
      - phrase: Congress's power covers how elections are held, not who may vote
        href: "#fact-federal-and-state-power-over-voting-rules/not-who-may-vote"
    verification:
      status: verified
      textHash: 622ec8624595
      checkedAt: 2026-11-20
  - heading: A president has no power to set voting rules by order
    citations:
      - phrase: Two federal courts have permanently blocked the 2025 order's proof-of-citizenship rule
        href: "#fact-federal-and-state-power-over-voting-rules/two-courts-blocked-2025-order"
      - phrase: One held that it goes beyond a president's power
        href: "#fact-federal-and-state-power-over-voting-rules/two-courts-blocked-2025-order"
      - phrase: the Supreme Court let the 2026 order's citizenship lists go ahead
        href: "#fact-federal-and-state-power-over-voting-rules/eo-14399-allowed"
      - phrase: that order requires nothing of anyone outside the executive branch
        href: "#fact-federal-and-state-power-over-voting-rules/order-binds-no-state"
      - phrase: It did not rule on whether the order is lawful
        href: "#fact-federal-and-state-power-over-voting-rules/no-merits-ruling"
    verification:
      status: verified
      textHash: b25dba05ff49
      checkedAt: 2026-11-20
  - heading: A state's ID rule binds no other state, and it can be undone
    visual:
      cite: "#fact-voter-id-rules-in-the-us-and-abroad/rules-vary-widely"
      kind: map
      title: Voter ID rules by state
    citations:
      - phrase: States differ on whether ID must have a photo, and on what happens to a voter without it
        href: "#fact-voter-id-rules-in-the-us-and-abroad/rules-vary-widely"
      - phrase: the number of strict photo-ID states fell as courts and legislatures eased laws, then rose again as others tightened theirs
        href: "#fact-voter-id-rules-in-the-us-and-abroad/strict-count-fell-then-rose"
      - phrase: state courts can review a state's election rules
        href: "#fact-federal-and-state-power-over-voting-rules/moore-state-courts"
    verification:
      status: verified
      textHash: f7a9cf13afa2
      checkedAt: 2026-11-20
  - heading: National bills from either party would take away the states' choice
    citations:
      - phrase: The Republican bill would require proof of citizenship and photo ID
        href: "#fact-federal-and-state-power-over-voting-rules/save-america-act-provisions"
      - phrase: The Democratic one would have required early voting and made ID states accept alternatives
        href: "#fact-federal-and-state-power-over-voting-rules/freedom-to-vote-act-provisions"
      - phrase: Both stalled short of the 60 votes needed in the Senate
        href: "#fact-federal-and-state-power-over-voting-rules/national-bills-stalled"
      - phrase: The Democrats' bill got 49 votes, and a photo-ID version of the Republicans' got 52
        href: "#fact-federal-and-state-power-over-voting-rules/national-bills-stalled"
    verification:
      status: verified
      textHash: b507996c2687
      checkedAt: 2026-11-20
  - heading: So Congress should step in only where states shut voters out, and leave ID to the states
    visual:
      cite: "#fact-election-fraud-and-voter-exclusion-history/pre-vra-stagnation"
      kind: barChart
      title: Black voter registration before 1965
    citations:
      - phrase: before the Voting Rights Act, Black registration in three Deep South states rose about five points or less
        href: "#fact-election-fraud-and-voter-exclusion-history/pre-vra-stagnation"
      - phrase: a national study found strict ID laws had no clear effect on registration or turnout
        href: "#fact-burdens-of-id-and-citizenship-rules/national-panel-no-turnout-effect"
      - phrase: it cannot rule out drops like those in Kansas and Tennessee
        href: "#fact-burdens-of-id-and-citizenship-rules/burden-without-turnout-effect"
      - phrase: The Supreme Court calls Congress's power over elections "paramount"
        href: "#fact-federal-and-state-power-over-voting-rules/congress-power-paramount"
      - phrase: none of the three national laws in force requires ID or proof of citizenship of every voter
        href: "#fact-federal-and-state-power-over-voting-rules/laws-require-no-id-for-all"
    verification:
      status: verified
