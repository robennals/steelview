cards:
  - heading: Voter lists hold many out-of-date names, and fraud has used them
    visual:
      cite: "#fact-voter-roll-maintenance/pew-only-direct-measure"
      kind: comparison
      title: Registrations that shouldn't be on the rolls
    citations:
      - phrase: The only national estimate, from data to March 2011, found about one record in eight wrong or out of date, including dead people and people registered in two states
        href: "#fact-voter-roll-maintenance/pew-only-direct-measure"
      - phrase: removing someone for a move can take through two federal general elections
        href: "#fact-voter-roll-maintenance/removal-waits-two-elections"
      - phrase: most wrong records belong to eligible voters with old details
        href: "#fact-voter-roll-maintenance/pew-not-fraud"
      - phrase: Chicago's 1982 fraud cast ballots in the names of people who had died or moved
        href: "#fact-election-fraud-and-voter-exclusion-history/stale-rolls-enabled-fraud"
    verification:
      status: verified
      textHash: 2af81c5f4bfe
      checkedAt: 2026-11-23
      notes:
        - The estimate predates ERIC and the growth in removals since, so it is not today's size of the problem. The chart shows the dead and multiply registered; the one-in-eight total is in its source quote.
  - heading: Most fraud on record went around the check at the polls
    visual:
      cite: "#fact-election-fraud-and-voter-exclusion-history/id-would-not-reach"
      kind: comparison
      title: Twenty fraud cases by method
    citations:
      - phrase: In 14 of 20 recorded cases, a polling-place ID check would not have reached it
        href: "#fact-election-fraud-and-voter-exclusion-history/id-would-not-reach"
      - phrase: the officials checking were often part of it
        href: "#fact-election-fraud-and-voter-exclusion-history/checkers-complicit"
    verification:
      status: verified
      textHash: fcad560fc8bd
      checkedAt: 2026-11-23
      notes:
        - The 20 are the cases the report lists, not a sample. Whether a photo rule would still have deterred the ghost voting is not measured.
  - heading: Non-citizens are found in government records, not at the door
    visual:
      cite: "#fact-non-citizens-on-voter-rolls/found-on-rolls"
      kind: comparison
      title: Non-citizens found on voter rolls
    citations:
      - phrase: Georgia, Iowa, Louisiana, Ohio and Kansas each found non-citizens on their lists
        href: "#fact-non-citizens-on-voter-rolls/found-on-rolls"
      - phrase: transportation files, immigration records and sworn excusals from jury duty
        href: "#fact-non-citizens-on-voter-rolls/checks-rest-on-records"
      - phrase: held back those its records could not verify
        href: "#fact-non-citizens-on-voter-rolls/georgia-2022-held-at-registration"
    verification:
      status: verified
      textHash: 715eea46fdfd
      checkedAt: 2026-11-23
      notes:
        - '"A photo ID shows who a voter is, not whether they are a citizen" is a general statement: some licences issued to non-citizens are marked as limited-term.'
  - heading: Matching must be careful, because it also flags eligible voters
    visual:
      cite: "#fact-non-citizens-on-voter-rolls/flag-lists-shrink"
      kind: comparison
      title: Flagged voters later shown to be citizens
    citations:
