name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      # The production build is covered by playwright.config.ts's webServer,
      # which runs `pnpm build && pnpm start`. Publication-time editorial
      # integrity is deliberately separate from CI so in-progress edits do not
      # prevent a development build from rendering.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      # The figures audit: a money/percentage/thousands figure asserted in a
      # markdown body must appear in a quoted source on the same topic. Runs
      # last: it currently has known (genuine, content-round) findings, and
      # while its count is non-zero it must not stand ahead of lint, the
      # unit tests, the build, or e2e and hide a failure in any of them.
      - run: pnpm check:figures
