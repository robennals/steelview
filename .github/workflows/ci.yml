name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      # The figures audit: a money/percentage/thousands figure asserted in a
      # markdown body must appear in a quoted source on the same topic.
      - run: pnpm check:figures
      # No standalone `pnpm build` here: playwright.config.ts's webServer
      # already runs `pnpm build && pnpm start`, and a build failure comes
      # through in the test:e2e output with the same ContentError message
      # (file, field, and reason) as a standalone build — verified by
      # breaking content/topics/uk-immigration/topic.md locally and
      # confirming `pnpm test:e2e` alone surfaced it clearly.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
